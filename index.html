let state={day:'d9',picks:{},extras:{},skip:{}};try{Object.assign(state,JSON.parse(localStorage.getItem('ooty-v1')||'{}'));}catch(e){}if(!state.day.startsWith('d'))state.day='d9';state.skip=state.skip||{};let section='plan',leg='back',lastFocus;
const titles={d9:['Birthday, unhurried.','Town · chocolates · dinner'],d10:['Tea trails & toy trains.','Coonoor · booked train · lake'],d11:['Above the clouds.','Peak · garden · café'],d12:['One last stretch of green.','Pykara · night bus home']};
const starts={d9:'Morning: breakfast, bag drop & rest. Bus arrival depends on the service booked.',d10:'Leave town 8:45 am → Highfield · 23 km / ~1 hr',d11:'Leave town 8:30 am → Doddabetta · 10 km / ~30 min',d12:'Check out & store bags if agreed. Leave 9 am → 9th Mile · 14.5 km / ~35 min'};
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}function save(){try{localStorage.setItem('ooty-v1',JSON.stringify(state))}catch(e){}}
days.find(d=>d.id==='go').options=days.find(d=>d.id==='go').options.filter(o=>o.number===1);
function render(){document.getElementById('heroImg').src=IMGS.wenlock;document.getElementById('days').innerHTML=days.filter(d=>d.stops).map(d=>`<button class="day-btn ${state.day===d.id?'active':''}" onclick="setDay('${d.id}')" aria-pressed="${state.day===d.id}">${d.dow.toUpperCase()}<strong>${d.num}</strong>${d.chip}</button>`).join('');const d=days.find(d=>d.id===state.day), t=titles[d.id];let stops=d.stops.slice();(d.extras||[]).filter(s=>state.extras[s.id]).forEach(s=>stops.splice(Math.min(s.slot,stops.length),0,s));document.getElementById('itinerary').innerHTML=`<div class="day-top"><div><span class="eyebrow">${t[1]}</span><h2>${t[0]}</h2></div><button class="round" aria-label="Day timing and route" onclick="dayInfo()">↗</button></div><div class="route-intro">${esc(starts[d.id])}<br><small>Road legs are town-centre estimates.</small></div>`+stops.map(s=>`<article class="stop ${state.skip[s.id]?'skipped':''}" role="button" tabindex="0" onclick="showStop('${s.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showStop('${s.id}')}" aria-label="Details for ${esc(s.title)}"><img loading="lazy" src="${IMGS[s.id]}" alt="${esc(s.alt)}"><span class="number">${s.number||s.letter}</span><div class="body"><div class="time">${esc(s.time)}</div><h3>${esc(s.title)}</h3><div class="category">${state.skip[s.id]?'Skipped · tap to restore':esc(s.dur)+' there'+(s.id==='train'?' · Booked ✓':'')}</div></div><span class="chevron">›</span></article>${s.leg?`<div class="leg">↳ ${esc(s.leg)}</div>`:''}`).join('')+(d.banner?`<button class="banner" onclick="setLeg('back');setPanel('buses')"><span>Sat 12 · night bus home<small>20:30 out → Majestic 07:00 Sun 13</small></span><span>↗</span></button>`:'')+`<details class="extras"><summary>Optional extras · ${(d.extras||[]).length} ideas</summary>${(d.extras||[]).map(s=>`<div class="extra"><img loading="lazy" src="${IMGS[s.id]}" alt="${esc(s.alt)}"><div><button style="background:transparent;padding:0;text-align:left" onclick="showStop('${s.id}')">${esc(s.title)}</button><small>${esc(s.time)}</small></div><button class="smallbtn" onclick="toggleExtra('${s.id}')">${state.extras[s.id]?'Remove':'＋ Add'}</button></div>`).join('')}</details>`;renderBuses();}
function setDay(id){state.day=id;save();render()}function setLeg(id){leg=id;renderBuses()}function setPanel(id){section=id;document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('[data-panel]').forEach(b=>b.classList.toggle('active',b.dataset.panel===id));window.scrollTo(0,0)}
function renderBuses(){document.getElementById('outTab').classList.toggle('active',leg==='go');document.getElementById('backTab').classList.toggle('active',leg==='back');const d=days.find(d=>d.leg===leg);document.getElementById('busList').innerHTML=`<span class="eyebrow">${leg==='back'?'Saturday night → Sunday morning':'Tuesday night → Wednesday morning'}</span><h2>${leg==='back'?'Home, after a full last day.':'Sleep your way to the hills.'}</h2><div class="notice">${leg==='back'?'Your target: Majestic at 7–8 am. Asian Xpress lists 07:00. Nothing booked.':'Departure 8 Dec night. Nothing booked. Fares below are earlier listings, not a current quote.'}</div>`+d.options.map(o=>`<article class="bus"><span class="eyebrow">${o.rec?'Suggested pick':'Alternative'} · option ${o.number}</span><h3>${esc(o.title)}</h3><div class="row"><div class="fare">${esc(o.price)}<small>${esc(o.per)}</small></div><button class="smallbtn" onclick="pickBus('${d.leg}',${o.number})">${state.picks[d.leg]===o.number?'Saved ✓':'Save pick'}</button></div><details><summary>Arrival, refund & fare details</summary>${o.facts.map(f=>`<p>${esc(f)}</p>`).join('')}</details></article>`).join('')+`<p class="muted">${d.src}</p><p class="muted">Saving a pick is not a booking. Check the exact berth pair, final total, drop-off and cancellation deadline before paying.</p>`;}
function pickBus(l,n){state.picks[l]===n?delete state.picks[l]:state.picks[l]=n;save();renderBuses()}function toggleExtra(id){state.extras[id]=!state.extras[id];save();render()}function toggleSkip(id){state.skip[id]=!state.skip[id];save();render();closeModal()}
function showModal(html){lastFocus=document.activeElement;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').hidden=false;document.body.style.overflow='hidden';document.querySelector('.sheet').scrollTop=0;document.querySelector('.close').focus()}
function closeModal(){document.getElementById('modal').hidden=true;document.body.style.overflow='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function showStop(id){const d=days.find(d=>[...(d.stops||[]),...(d.extras||[])].some(s=>s.id===id));const s=[...(d.stops||[]),...(d.extras||[])].find(s=>s.id===id);showModal(`<img src="${IMGS[id]}" alt="${esc(s.alt)}"><div class="sheet-content"><span class="eyebrow">${d.dow} ${d.num} Dec · ${s.number?'Stop '+s.number:'Optional extra'}</span><h2>${esc(s.title)}</h2><div class="meta">${esc(s.time)} · ${esc(s.dur)}</div>${s.id==='train'?'<div class="train-ticket"><b>12:35 → 13:45</b><small>Coonoor → Ooty · 56143<br>First Class · confirmed ×2<br>Reach the station by 12:15 pm · photo ID each</small></div>':''}<p>${esc(s.why)}</p><p><b>${esc(s.cost)}</b></p>${s.leg?`<p>Next → ${esc(s.leg)}</p>`:''}<details><summary class="muted">Practical notes</summary><p>${esc(s.detail)}</p></details><div class="sheet-actions">${s.map?`<a target="_blank" rel="noopener" href="${s.map}">Open map ↗</a>`:''}<a href="${s.url}" target="_blank" rel="noopener">Source ↗</a>${s.id==='train'?'':s.letter?`<button onclick="toggleExtra('${id}');closeModal()">${state.extras[id]?'Remove extra':'Add to day'}</button>`:`<button onclick="toggleSkip('${id}')">${state.skip[id]?'Restore stop':'Skip stop'}</button>`}</div><p class="credit">${esc(s.credit)}</p></div>`)}
function dayInfo(){const d=days.find(d=>d.id===state.day);showModal(`<div class="sheet-content"><span class="eyebrow">${d.dow} ${d.num} December</span><h2>Timing & route</h2><p>${esc(d.note)}</p><p class="credit">Road distances and times are estimates from Ooty town centre. Final hotel location and traffic change them.</p></div>`)}function showNote(id){const n=NOTES[id];showModal(`<div class="sheet-content"><h2>${n.t}</h2>${n.h}</div>`)}document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&!document.getElementById('modal').hidden){const a=[...document.querySelector('.sheet').querySelectorAll('button,a,summary')].filter(e=>e.getClientRects().length);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});render();
</script></body></html>
