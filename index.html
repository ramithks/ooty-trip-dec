<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ooty trip · Dec 9–12</title>
<style>
:root{
  --bg:#0a0e0c;
  --card:#121814; --card2:#172019;
  --ink:#eef4ef; --mut:#93a596; --faint:#67796c;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --grn:#43d68f; --grn-ink:#0a0e0c;
  --amber:#e8b96a; --ember:#ef7d4e;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--grn);outline-offset:2px;border-radius:8px}
a{color:var(--grn);text-decoration:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(10,14,12,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:12px 16px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.top h1{font-size:19px;font-weight:800;letter-spacing:.2px}
.top h1 span{color:var(--grn);font-weight:600}
.top .sub{font-size:12px;color:var(--mut);white-space:nowrap}
.pills{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 11px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.pill small{display:block;font-size:10px;font-weight:500;color:var(--faint)}
.pill.on{background:var(--grn);border-color:var(--grn);color:var(--grn-ink)}
.pill.on small{color:rgba(10,14,12,.7)}
.picked-line{max-width:720px;margin:0 auto;padding:0 16px 9px;font-size:12px;color:var(--amber);display:none}
.picked-line.on{display:block}

/* hero */
.hero{max-width:720px;margin:12px auto 2px;padding:0 16px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.hero::-webkit-scrollbar{display:none}
.hero img{height:150px;width:225px;object-fit:cover;border-radius:18px;flex:0 0 auto}

main{max-width:720px;margin:0 auto;padding:4px 16px 80px}
.day{display:none}
.day.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.day-head{margin:14px 2px 3px;display:flex;gap:12px;align-items:center}
.date-badge{flex:0 0 auto;width:50px;height:50px;border-radius:15px;background:linear-gradient(150deg,var(--grn),#1d9e63);color:var(--grn-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:0 4px 14px rgba(67,214,143,.22)}
.date-badge .dow{font-size:10px;text-transform:uppercase;letter-spacing:.7px;opacity:.8;font-weight:700}
.date-badge .num{font-size:20px;font-weight:800}
.day-head h2{font-size:17.5px;font-weight:750}
.day-note{font-size:13px;color:var(--mut);margin:0 2px 14px}

/* photo cards */
.card{position:relative;border-radius:20px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line);cursor:pointer;transition:transform .12s ease,border-color .15s}
.card:active{transform:scale(.985)}
.card>img{width:100%;height:196px;object-fit:cover}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,8,.18) 0%,rgba(6,9,8,0) 32%,rgba(6,9,8,.55) 62%,rgba(6,9,8,.9) 100%);pointer-events:none}
.num{position:absolute;top:11px;left:11px;width:31px;height:31px;border-radius:50%;background:linear-gradient(150deg,var(--ember),#c8542c);color:#fff;font-weight:800;font-size:14.5px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.num.letter{background:linear-gradient(150deg,var(--amber),#b9832f);color:#241703}
.cinfo{position:absolute;left:13px;right:13px;bottom:11px;pointer-events:none}
.ct{display:block;font-size:16.5px;font-weight:750;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.cm{display:block;font-size:12.5px;color:#cfdad1;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.addbtn{position:absolute;top:11px;right:11px;font-size:12.5px;font-weight:750;color:var(--grn);background:rgba(10,14,12,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1.5px solid var(--grn);border-radius:999px;padding:5px 13px}
.addbtn.added{color:var(--grn-ink);background:var(--grn)}
.tap-hint{position:absolute;bottom:11px;right:13px;font-size:11px;color:rgba(238,244,239,.75);pointer-events:none}

/* extras section */
.extras-title{font-size:12px;font-weight:750;color:var(--amber);margin:18px 2px 9px;letter-spacing:.5px;text-transform:uppercase}

/* option rows (buses) */
.opt{display:flex;gap:11px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.opt.picked{border-color:var(--grn);box-shadow:0 0 0 3px rgba(67,214,143,.13)}
.onum{flex:0 0 auto;width:27px;height:27px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);color:var(--mut);font-size:12.5px;font-weight:750;display:flex;align-items:center;justify-content:center}
.omain{flex:1 1 auto;min-width:0}
.ot{font-size:14.5px;font-weight:700}
.rec{display:inline-block;vertical-align:1px;margin-left:6px;font-size:9.5px;background:var(--grn);color:var(--grn-ink);border-radius:999px;padding:2px 8px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.om{font-size:12px;color:var(--mut);margin-top:2px}
.op{font-size:13px;color:var(--amber);font-weight:700;margin-top:4px}
.op small{color:var(--mut);font-weight:500}
.pick{flex:0 0 auto;font-size:12.5px;font-weight:750;color:var(--grn);border:1.5px solid var(--grn);border-radius:999px;padding:6px 14px;transition:background .15s,color .15s}
.opt.picked .pick{background:var(--grn);color:var(--grn-ink)}
.src-note{font-size:11.5px;color:var(--faint);margin:2px 2px 8px}

/* go-home banner */
.gohome{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:linear-gradient(140deg,rgba(232,185,106,.13),rgba(232,185,106,.05));border:1.5px solid rgba(232,185,106,.3);border-radius:16px;padding:13px 15px;text-align:left;margin:6px 0 10px}
.gohome .m{font-size:14px;font-weight:750;color:var(--amber)}
.gohome .arr{color:var(--amber);font-size:17px;font-weight:700}

/* footer */
.fine{max-width:720px;margin:0 auto;padding:0 16px 44px}
.fine-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.fine-btn{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:650}
.updated{font-size:11px;color:var(--faint);text-align:center;margin:22px 0 6px}

/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(4,6,5,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:88dvh;background:var(--card2);border-radius:22px 22px 0 0;border:1px solid var(--line2);border-bottom:0;transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,.35,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.show{transform:translateY(0)}
.grip{flex:0 0 auto;padding:9px 0 7px;touch-action:none;cursor:grab}
.grip span{display:block;width:42px;height:4.5px;border-radius:999px;background:var(--line2);margin:0 auto}
.x{position:absolute;top:20px;right:13px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(10,14,12,.66);backdrop-filter:blur(6px);color:var(--amber);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sheet-scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-img{width:100%;height:212px;object-fit:cover}
.sheet-body{padding:14px 17px 34px}
.sh-kick{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;font-weight:750;margin-bottom:4px}
.sheet-body h3{font-size:19px;font-weight:800;margin-bottom:3px}
.sh-meta{font-size:13px;color:var(--mut);margin-bottom:10px}
.sh-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sh-chip{font-size:11.5px;background:rgba(67,214,143,.12);color:#62d8a2;border:1px solid rgba(67,214,143,.2);border-radius:999px;padding:3px 10px;font-weight:650}
.sh-chip.warn{background:rgba(239,125,78,.12);color:#f09a70;border-color:rgba(239,125,78,.22)}
.sheet-body p{font-size:13.5px;color:#c2d1c6;margin-bottom:9px}
.sheet-body p.cost{color:var(--ink);font-weight:650}
.ticket{background:linear-gradient(140deg,#123524,#0d241a 60%,#0c1d15);border:1px solid rgba(67,214,143,.3);border-radius:15px;padding:12px 13px;margin:4px 0 11px}
.ticket .trow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ticket .t{font-size:20px;font-weight:800}
.ticket .arrow{color:var(--grn);font-weight:700}
.ticket .stns{font-size:12.5px;color:var(--mut)}
.ticket .tnote{font-size:12px;color:var(--mut);margin-top:8px}
.ticket .tnote b{color:var(--amber)}
.sh-links{font-size:13.5px;margin-top:2px}
.sh-links a{font-weight:700}
.sh-credit{font-size:11px;color:var(--faint);margin-top:8px}
@media(min-width:640px){
  .hero img{height:176px;width:264px}
  .card>img{height:225px}
  .sheet-img{height:250px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1>Ooty <span>Dec 9–12</span></h1>

  </div>

</header>

<div class="hero" id="hero"></div>

<main id="main"></main>

<footer class="fine">
  <div class="fine-row">
    <button class="fine-btn" data-note="costs">Costs</button>
    <button class="fine-btn" data-note="book">Still to book</button>
    <button class="fine-btn" data-note="know">Good to know</button>
    <button class="fine-btn" data-note="src">Sources</button>
  </div>
  <div class="updated">Updated 22 Nov 2026 · fares are listings, not paid totals</div>
</footer>

<div class="sheet-wrap" id="sheetWrap" hidden>

    <div class="sheet-scroll" id="sheetScroll"></div>
  </div>
</div>

<script src="photos-a.js"></script>
<script src="photos-b.js"></script>

/* state */
let state={day:'go',picks:{},extras:{}};
try{const s=localStorage.getItem('ooty-v1');if(s)state=Object.assign(state,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem('ooty-v1',JSON.stringify(state));}catch(e){}}

const pillsEl=document.getElementById('pills');
const mainEl=document.getElementById('main');
const heroEl=document.getElementById('hero');
const wrapEl=document.getElementById('sheetWrap');
const sheetEl=document.getElementById('sheet');
const gripEl=document.getElementById('grip');
const scrollEl=document.getElementById('sheetScroll');

hero.forEach(([id,alt])=>{const i=document.createElement('img');i.src=IMGS[id];i.alt=alt;i.loading='lazy';heroEl.appendChild(i);});

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* bottom sheet */
function openSheet(html){
  scrollEl.innerHTML=html;
  scrollEl.scrollTop=0;
  wrapEl.hidden=false;
  sheetEl.style.transition='';sheetEl.style.transform='';
  requestAnimationFrame(()=>sheetEl.classList.add('show'));
  document.body.style.overflow='hidden';
}
function closeSheet(){
  sheetEl.classList.remove('show');
  document.body.style.overflow='';
  setTimeout(()=>{wrapEl.hidden=true;scrollEl.innerHTML='';},300);
}
let dragY=0,dragD=0,dragging=false;
gripEl.addEventListener('pointerdown',e=>{dragging=true;dragY=e.clientY;dragD=0;gripEl.setPointerCapture(e.pointerId);});
gripEl.addEventListener('pointermove',e=>{
  if(!dragging)return;
  dragD=Math.max(0,e.clientY-dragY);
  sheetEl.style.transition='none';
  sheetEl.style.transform='translateY('+dragD+'px)';
});
function endDrag(){
  if(!dragging)return;dragging=false;
  sheetEl.style.transition='';sheetEl.style.transform='';
  if(dragD>90)closeSheet();
}
gripEl.addEventListener('pointerup',endDrag);
gripEl.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!wrapEl.hidden)closeSheet();});

function ticketBlock(){
  return `<div class="ticket">
    <div class="trow"><span class="t">12:35</span><span class="arrow">→</span><span class="t">1:45</span><span class="stns">Coonoor to Ooty · train 56143</span></div>
    <div class="sh-chips" style="margin:9px 0 0"><span class="sh-chip">Booked ✓</span><span class="sh-chip">Confirmed ×2</span><span class="sh-chip">First Class</span></div>
    <p class="tnote">At Coonoor station by <b>12:15 pm</b>, photo ID each.</p>
  </div>`;
}

function openStop(dayId,sid){
  const d=days.find(x=>x.id===dayId);
  const all=[...(d.stops||[]),...(d.extras||[])];
  const st=all.find(x=>x.id===sid);
  if(!st)return;
  const kick=(d.dow+' '+d.num)+' · '+(st.number?('Stop '+st.number):('Extra '+st.letter));
  const img=IMGS[st.id]?`<img class="sheet-img" src="${IMGS[st.id]}" alt="${esc(st.alt)}">`:'';
  openSheet(`${img}
    <div class="sheet-body">
      <div class="sh-kick">${esc(kick)}</div>
      <h3>${esc(st.title)}</h3>
      <div class="sh-meta">${esc(st.time)}</div>
      <div class="sh-chips"><span class="sh-chip">${esc(st.cat)}</span><span class="sh-chip warn">${esc(st.costShort)}</span></div>
      <p>${esc(st.why)}</p>
      <p class="cost">${esc(st.cost)}</p>
      ${st.id==='train'?ticketBlock():''}
      <p>${esc(st.detail)}</p>
      <div class="sh-links"><a href="${st.url}" target="_blank" rel="noopener">Source</a>${st.map?` · <a href="${st.map}" target="_blank" rel="noopener">Map</a>`:''}</div>
      <div class="sh-credit">${esc(st.credit)}</div>
    </div>`);
}

const NOTES={
 costs:{t:'Costs at a glance',h:'<p><b>Toy train ×2:</b> booked, paid already.</p><p><b>Buses both ways ×2:</b> about ₹3,400–4,900. Recommended pair ₹3,688, live listings 22 Nov, before fees.</p><p><b>Stay Dec 9–12:</b> 3 nights; set the Airbnb dates before booking.</p><p class="sh-credit">Not the whole-trip total: stay, cabs/autos, meals, entries and boating are extra. Food budgets are estimates; entry prices are listings to reconfirm at the counter.</p>'},
 book:{t:'Still to book',h:'<p><b>Buses:</b> pick one each way in the Tue 8 and Sun 13 tabs. Not booked yet.</p><p><b>Airbnb:</b> set dates to Dec 9–12; ask the host about early bag drop on the 9th and keeping bags till evening on the 12th.</p><p><b>Scooter:</b> fully optional. This plan works with cabs and autos.</p>'},
 know:{t:'Good to know',h:'<p>December in Ooty: about 21°C by day, 9°C at night. Pack warm layers.</p><p>Re-check train 56143 on IRCTC a day before; hill trains can change.</p><p>Hill paths, boat boarding and garden slopes are uneven in places: cabs and autos over long walks, and skip any stretch that feels like too much.</p><p>Highfield asks for an advance visit reservation; confirm before the Coonoor morning. All activity windows are suggestions, not appointments.</p>'},
 src:{t:'Sources & freshness',h:'<p>Place photos and entry listings: Ooty Tourism, linked on each place. Highfield ticket pages checked 22 Nov 2026 (₹50 adult / ₹150 special). Sim\'s Park and Rose Garden fees from Ooty Tourism pages (₹75 adult each). Tea flavours: Tamil Nadu Tourism.</p><p>Café and dinner: Littlearth official venue pages and menus; <a href="https://www.newindianexpress.com/xplore/2024/Jun/06/eating-your-way-through-ooty">New Indian Express food guide</a>; <a href="https://timesofindia.indiatimes.com/travel/ooty/earls-secret/ps33024535.cms">Times Travel on Earl\'s Secret</a>. No table or cake arranged.</p><p>Buses: redBus dated searches, 22 Nov 2026. Drive times: Google Maps estimates, 22 Nov, not guaranteed hill-road conditions.</p>'}
};
function openNote(key){
  const n=NOTES[key];if(!n)return;
  openSheet(`<div class="sheet-body"><h3>${n.t}</h3>${n.h}</div>`);
}

/* photo card */
function stopCard(st,dayId,isExtra,inPlan){
  const card=document.createElement('article');
  card.className='card';
  card.dataset.sid=st.id;card.dataset.day=dayId;card.dataset.open='1';
  const badge=st.number?`<span class="num">${st.number}</span>`:`<span class="num letter">${st.letter}</span>`;
  const add=isExtra?`<button class="addbtn ${inPlan?'added':''}" data-add="${st.id}">${inPlan?'Added ✓':'+ Add'}</button>`:'';
  card.innerHTML=`
    <img src="${IMGS[st.id]}" alt="${esc(st.alt)}" loading="lazy">
    <div class="shade"></div>
    ${badge}${add}
    <div class="cinfo">
      <span class="ct">${esc(st.title)}</span>
      <span class="cm">${esc(st.time)} · ${esc(st.costShort)}</span>
    </div>`;
  return card;
}

function renderDay(d){
  const sec=document.createElement('section');
  sec.className='day'+(state.day===d.id?' on':'');
  sec.id='day-'+d.id;
  sec.innerHTML=`<div class="day-head">
    <span class="date-badge"><span class="dow">${d.dow}</span><span class="num">${d.num}</span></span>
    <h2>${esc(d.title)}</h2></div>
    <p class="day-note">${esc(d.note)}</p>`;

  if(d.type==='options'){
    const wrap=document.createElement('div');
    d.options.forEach(o=>{
      const picked=state.picks[d.leg]===o.number;
      const el=document.createElement('div');
      el.className='opt'+(picked?' picked':'');
      el.innerHTML=`<span class="onum">${o.number}</span>
        <div class="omain">
          <div class="ot">${esc(o.title)}${o.rec?'<span class="rec">Recommended</span>':''}</div>
          ${o.facts.map(f=>`<div class="om">${esc(f)}</div>`).join('')}
          <div class="op">${esc(o.price)} <small>${esc(o.per)}</small></div>
        </div>
        <button class="pick" data-pick="${d.leg}:${o.number}">${picked?'Picked ✓':'Pick'}</button>`;
      wrap.appendChild(el);
    });
    sec.appendChild(wrap);
    const sn=document.createElement('p');sn.className='src-note';sn.innerHTML=d.src;sec.appendChild(sn);
  }else{
    const addedExtras=(d.extras||[]).filter(x=>state.extras[x.id]);
    const stops=d.stops.slice();
    addedExtras.forEach(x=>stops.splice(Math.min(x.slot,stops.length),0,x));
    stops.forEach(st=>sec.appendChild(stopCard(st,d.id,!!st.letter,!!st.letter)));
    if(d.banner){
      const b=document.createElement('button');b.className='gohome';b.dataset.goto='back';
      b.innerHTML=`<span class="m">Then: 7:45 pm sleeper bus home · ₹1,149</span><span class="arr">→</span>`;
      sec.appendChild(b);
    }
    const pending=(d.extras||[]).filter(x=>!state.extras[x.id]);
    if(pending.length){
      const h=document.createElement('div');h.className='extras-title';
      h.textContent='Add if you want to cover more';
      sec.appendChild(h);
      pending.forEach(x=>sec.appendChild(stopCard(x,d.id,true,false)));
    }
  }
  return sec;
}

function renderPills(){
  pillsEl.innerHTML='';
  days.forEach(d=>{
    const b=document.createElement('button');
    b.className='pill'+(state.day===d.id?' on':'');
    b.innerHTML=`${d.dow} ${d.num}<small>${esc(d.chip)}</small>`;
    b.onclick=()=>{state.day=d.id;save();render();window.scrollTo({top:0});};
    pillsEl.appendChild(b);
  });
}

function renderPicked(){
  const el=document.getElementById('pickedLine');
  const parts=[];
  ['go','back'].forEach(leg=>{
    const n=state.picks[leg];
    if(n!=null){const d=days.find(x=>x.leg===leg);const o=d.options.find(y=>y.number===n);
      parts.push((leg==='go'?'Go':'Return')+': '+o.title+' ('+o.price+')');}
  });
  const added=Object.keys(state.extras).filter(k=>state.extras[k]).length;
  if(added)parts.push(added+' extra stop'+(added>1?'s':'')+' added');
  el.textContent=parts.length?('Your picks · '+parts.join(' · ')):'';
  el.className='picked-line'+(parts.length?' on':'');
}

function render(){
  renderPills();
  mainEl.innerHTML='';
  days.forEach(d=>mainEl.appendChild(renderDay(d)));
  renderPicked();
}

mainEl.addEventListener('click',e=>{
  const add=e.target.closest('[data-add]');
  if(add){e.stopPropagation();const id=add.dataset.add;
    state.extras[id]=!state.extras[id];if(!state.extras[id])delete state.extras[id];
    save();render();return;}
  const pick=e.target.closest('[data-pick]');
  if(pick){const [leg,n]=pick.dataset.pick.split(':');
    const num=parseInt(n,10);
    if(state.picks[leg]===num)delete state.picks[leg];else state.picks[leg]=num;
    save();render();return;}
  const go=e.target.closest('[data-goto]');
  if(go){state.day=go.dataset.goto;save();render();window.scrollTo({top:0});return;}
  const open=e.target.closest('[data-open]');
  if(open){openStop(open.dataset.day,open.dataset.sid);return;}
});
document.querySelector('.fine').addEventListener('click',e=>{
  const nb=e.target.closest('[data-note]');
  if(nb)openNote(nb.dataset.note);
});
wrapEl.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet();});

render();
</script>
</body>
